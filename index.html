<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BTC Clicker</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

/* ================= BASE ================= */
body {
  margin:0;
  font-family: Arial;
  overflow:hidden;
  user-select:none; /* ❌ убрали выделение */
  color:white;
}

/* ================= THEMES ================= */
body.theme-green {
  background: radial-gradient(circle, #003b00, #000);
}

body.theme-blue {
  background: radial-gradient(circle, #001b3a, #000);
}

body.theme-space {
  background: radial-gradient(circle, #0a0a0a, #000);
}

body.theme-space::before {
  content:"";
  position:fixed;
  width:100%;
  height:100%;
  background:url('https://upload.wikimedia.org/wikipedia/commons/3/3f/HST-SM4.jpeg');
  opacity:0.15;
  animation:move 60s linear infinite;
}

@keyframes move {
  from {transform:translateX(0);}
  to {transform:translateX(-200px);}
}

/* ================= HEADER ================= */
header {
  text-align:center;
  padding:10px;
  color:#f7931a;
  font-weight:bold;
}

/* ================= ENERGY ================= */
.energy {
  text-align:center;
  color:#0f0;
}

/* ================= COIN ================= */
.coin {
  font-size:170px;
  text-align:center;
  margin-top:40px;
  cursor:pointer;
  transition:0.1s;
}

.coin:active {
  transform:scale(0.92);
}

/* ================= UPGRADE INFO ================= */
.info {
  text-align:center;
  margin-top:10px;
  font-size:14px;
  color:#aaa;
}

/* ================= PLUS EFFECT ================= */
.plus {
  position:absolute;
  color:#f7931a;
  animation:fade 1s forwards;
}

@keyframes fade {
  0%{opacity:1;transform:translateY(0)}
  100%{opacity:0;transform:translateY(-60px)}
}

/* ================= NAV ================= */
.nav {
  position:fixed;
  bottom:0;
  width:100%;
  display:flex;
  background:#111;
}

.nav button {
  flex:1;
  padding:12px;
  background:#111;
  border:none;
  color:white;
}

.nav button.active {
  background:#f7931a;
  color:black;
}

/* ================= SCREENS ================= */
.screen { display:none; }
.screen.active { display:block; }

/* ================= SHOP ================= */
.shop {
  padding:10px;
}

.item {
  margin:10px;
  padding:10px;
  background:#111;
  border-radius:10px;
}

button {
  width:100%;
  padding:10px;
  margin-top:5px;
  border:none;
  background:#f7931a;
}

/* ================= THEME BUTTONS ================= */
.themes {
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:10px;
}

.theme-btn {
  padding:5px 10px;
  background:#222;
  border:none;
  color:white;
  border-radius:6px;
}

</style>
</head>

<body class="theme-space">

<header>
₿ <span id="coins">0</span>
</header>

<div class="energy">⚡ Energy: <span id="energy">0</span></div>

<div id="home" class="screen active">

  <div class="coin" id="coin" onclick="tap(event)">🪙</div>

  <div class="info" id="upgradeInfo">До апгрейда: 100 тапов</div>

  <div class="themes">
    <button class="theme-btn" onclick="setTheme('theme-green')">Green</button>
    <button class="theme-btn" onclick="setTheme('theme-blue')">Blue</button>
    <button class="theme-btn" onclick="setTheme('theme-space')">Space</button>
  </div>

</div>

<div id="shop" class="screen shop">

  <div class="item">
    +1 Power
    <button onclick="buy('p1')">150₿</button>
  </div>

  <div class="item">
    +2 Power
    <button onclick="buy('p2')">400₿</button>
  </div>

</div>

<div id="top" class="screen">
  <div id="list"></div>
</div>

<div class="nav">
  <button class="active" onclick="show('home',this)">Home</button>
  <button onclick="show('shop',this)">Shop</button>
  <button onclick="show('top',this);loadTop()">Top</button>
</div>

<script>

let user;
let id;

let taps = 0;

/* INIT */
async function init(){

  if(window.Telegram){
    Telegram.WebApp.ready();
    id = Telegram.WebApp.initDataUnsafe.user.id;

    await fetch("/tg_auth",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({id})
    });

  } else id="1";

  load();
}

/* LOAD */
async function load(){
  let r = await fetch("/user/"+id);
  user = await r.json();

  document.getElementById("coins").innerText = user.coins;
  document.getElementById("energy").innerText = user.energy;

  updateUpgrade();
}

/* TAP */
async function tap(e){

  let r = await fetch("/tap",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({id})
  });

  let d = await r.json();

  load();

  taps++;

  let el=document.createElement("div");
  el.className="plus";
  el.innerText="+"+d.crit;
  el.style.left=e.clientX+"px";
  el.style.top=e.clientY+"px";
  document.body.appendChild(el);

  setTimeout(()=>el.remove(),1000);
}

/* UPGRADE INFO */
function updateUpgrade(){
  let next = 100 - (taps % 100);
  document.getElementById("upgradeInfo").innerText =
    "До улучшения монетки: " + next + " тапов";
}

/* BUY */
async function buy(item){
  await fetch("/buy",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({id, item})
  });

  load();
}

/* THEMES */
function setTheme(t){
  document.body.className = t;
}

/* TOP */
async function loadTop(){
  let r = await fetch("/leaderboard");
  let d = await r.json();

  document.getElementById("list").innerHTML =
    d.map((x,i)=>`#${i+1} ${x.name} - ${x.coins}`).join("<br>");
}

/* NAV */
function show(id,btn){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");

  document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
}

init();

</script>

</body>
</html>
