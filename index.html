<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BTC Clicker</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0b0b0b;
  color:white;
}

header {
  text-align:center;
  padding:10px;
  color:#f7931a;
  font-weight:bold;
}

.energy {
  text-align:center;
  margin-bottom:10px;
  color:#0f0;
}

.btc {
  font-size:180px;
  text-align:center;
  margin-top:60px;
  cursor:pointer;
  animation: float 3s infinite;
}

@keyframes float {
  0%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
  100%{transform:translateY(0)}
}

.plus {
  position:absolute;
  color:#f7931a;
  animation: fade 1s forwards;
}

@keyframes fade {
  0%{opacity:1;transform:translateY(0)}
  100%{opacity:0;transform:translateY(-50px)}
}

.nav {
  position:fixed;
  bottom:0;
  width:100%;
  display:flex;
  background:#111;
}

.nav button {
  flex:1;
  padding:15px;
  background:#111;
  border:none;
  color:white;
}

.nav button.active {
  background:#f7931a;
  color:black;
}

.screen { display:none; }
.screen.active { display:block; }

.shop { padding:10px; }

.item {
  margin:10px;
  padding:10px;
  background:#111;
  border-radius:10px;
}

button.buy {
  width:100%;
  padding:10px;
  margin-top:5px;
  background:#f7931a;
  border:none;
}
</style>
</head>

<body>

<header>
₿ <span id="coins">0</span>
</header>

<div class="energy">⚡ Energy: <span id="energy">0</span></div>

<div id="home" class="screen active">
  <div class="btc" onclick="tap(event)">₿</div>
</div>

<div id="shop" class="screen shop">
  <div class="item">
    +1 Power
    <button class="buy" onclick="buy('p1')">150₿</button>
  </div>

  <div class="item">
    +2 Power
    <button class="buy" onclick="buy('p2')">400₿</button>
  </div>
</div>

<div id="top" class="screen">
  <div id="list"></div>
</div>

<div class="nav">
  <button class="active" onclick="show('home',this)">Home</button>
  <button onclick="show('shop',this)">Shop</button>
  <button onclick="show('top',this);loadTop()">Top</button>
</div>

<script>

let user;
let id;

async function init(){

  if(window.Telegram){
    Telegram.WebApp.ready();
    id = Telegram.WebApp.initDataUnsafe.user.id;

    await fetch("/tg_auth",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({id})
    });

  } else id="1";

  load();
}

async function load(){
  let r = await fetch("/user/"+id);
  user = await r.json();

  document.getElementById("coins").innerText = user.coins;
  document.getElementById("energy").innerText = user.energy;
}

async function tap(e){

  let r = await fetch("/tap",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({id})
  });

  let d = await r.json();

  load();

  let el = document.createElement("div");
  el.className="plus";
  el.innerText = "+" + d.crit;
  el.style.left = e.clientX+"px";
  el.style.top = e.clientY+"px";
  document.body.appendChild(el);

  setTimeout(()=>el.remove(),1000);
}

async function buy(item){
  await fetch("/buy",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({id, item})
  });

  load();
}

async function loadTop(){
  let r = await fetch("/leaderboard");
  let d = await r.json();

  document.getElementById("list").innerHTML =
    d.map((x,i)=>`#${i+1} ${x.name} - ${x.coins}`).join("<br>");
}

function show(id,btn){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");

  document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
}

init();

</script>

</body>
</html>
