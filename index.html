<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BTC Clicker</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0b0b0b;
  color:white;
}

header {
  text-align:center;
  padding:10px;
  background:#111;
}

#coins {
  color:#f7931a;
  font-size:22px;
}

/* NAV */
.nav {
  position:fixed;
  bottom:0;
  width:100%;
  display:flex;
  background:#111;
}

.nav button {
  flex:1;
  padding:15px;
  border:none;
  background:#111;
  color:white;
}

.nav button.active {
  background:#f7931a;
  color:black;
}

/* SCREENS */
.screen {
  display:none;
  text-align:center;
  height:calc(100vh - 120px);
}

.screen.active {
  display:block;
}

/* BITCOIN */
.btc {
  font-size:160px;
  margin-top:70px;
  cursor:pointer;
  animation:float 3s infinite;
}

@keyframes float {
  0%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
  100%{transform:translateY(0)}
}

/* SHOP */
.btn {
  padding:12px;
  margin:8px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

.buy {
  background:#f7931a;
  color:black;
}

.locked {
  background:#333;
  color:#777;
}

/* LB */
.item {
  display:flex;
  justify-content:space-between;
  padding:10px;
  background:#111;
  margin:5px;
}
</style>
</head>

<body>

<header>
  <div id="coins">₿ 0</div>
</header>

<!-- HOME -->
<div id="home" class="screen active">
  <div class="btc" onclick="tap()">₿</div>
</div>

<!-- SHOP -->
<div id="shop" class="screen">
  <button id="up1" class="btn buy" onclick="buy1()">+1 Power (150₿)</button>
  <button id="up2" class="btn buy" onclick="buy2()">+2 Power (400₿)</button>
</div>

<!-- LEADERBOARD -->
<div id="lb" class="screen">
  <h3>🏆 Top</h3>
  <div id="list"></div>
</div>

<!-- NAV -->
<div class="nav">
  <button class="active" onclick="show('home',this)">Home</button>
  <button onclick="show('shop',this)">Shop</button>
  <button onclick="show('lb',this);loadLB()">Top</button>
</div>

<script>

let user=null;
let userId=null;

/* TELEGRAM INIT */
async function init(){

  if(window.Telegram && Telegram.WebApp){

    Telegram.WebApp.ready();

    let tg = Telegram.WebApp.initDataUnsafe.user;

    let r = await fetch("/tg_auth",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        id: tg.id,
        first_name: tg.first_name
      })
    });

    let data = await r.json();
    userId = data.id;

  } else {
    userId="1";
  }

  load();
}

/* LOAD */
async function load(){
  let r=await fetch(`/user/${userId}`);
  user=await r.json();

  if(!user.power) user.power=1;

  document.getElementById("coins").innerText="₿ "+user.coins;
}

/* TAP */
async function tap(){
  user.coins += user.power;

  await save();
  load();
}

/* SAVE */
async function save(){
  await fetch("/save",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(user)
  });
}

/* SHOP */
async function buy1(){
  if(user.coins<150) return;
  user.coins-=150;
  user.power+=1;
  await save();
  load();
}

async function buy2(){
  if(user.coins<400) return;
  user.coins-=400;
  user.power+=2;
  await save();
  load();
}

/* LB */
async function loadLB(){
  let r=await fetch("/leaderboard");
  let data=await r.json();

  let html="";

  data.forEach((u,i)=>{
    html+=`
      <div class="item">
        <div>#${i+1}</div>
        <div>${u.name}</div>
        <div>${u.coins}</div>
      </div>
    `;
  });

  document.getElementById("list").innerHTML=html;
}

/* NAV */
function show(id,btn){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");

  document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
}

init();

</script>

</body>
</html>
