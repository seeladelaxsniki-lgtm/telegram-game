<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>BTC Clicker</title>
    <style>
        body {
            background: #0f172a;
            color: white;
            font-family: Arial;
            text-align: center;
            margin-top: 100px;
        }

        button {
            padding: 15px 25px;
            font-size: 20px;
            border: none;
            border-radius: 10px;
            background: #22c55e;
            color: white;
            cursor: pointer;
        }

        .score {
            font-size: 40px;
            margin: 20px;
        }
    </style>
</head>
<body>

<h1>🚀 BTC Clicker</h1>

<div class="score" id="score">0</div>

<button onclick="clicker()">+1 BTC</button>

<script>
    let score = localStorage.getItem("btc") || 0;
    document.getElementById("score").innerText = score;

    function clicker() {
        score++;
        document.getElementById("score").innerText = score;
        localStorage.setItem("btc", score);
    }
</script>

</body>
</html>
