<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BTC Clicker</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

body {
  margin:0;
  font-family: Arial;
  user-select:none;
  overflow:hidden;
  color:white;
  padding-bottom:70px;
  background:black;
}

/* ===== BACKGROUND ===== */
#bg {
  position:fixed;
  width:100%;
  height:100%;
  top:0;
  left:0;
  z-index:-1;
}

.bg-neon {
  background: radial-gradient(circle at top, #1b1b2f, #000);
}

.bg-cyber {
  background: radial-gradient(circle at top, #002b45, #000);
}

.bg-dark {
  background: radial-gradient(circle at center, #111, #000);
}

/* ===== HEADER ===== */
header {
  text-align:center;
  padding:10px;
  color:#f7931a;
  font-weight:bold;
}

.energy {
  text-align:center;
  opacity:0.9;
  font-size:14px;
}

/* ===== COIN ===== */
.coin {
  display:flex;
  justify-content:center;
  align-items:center;
  margin-top:70px;
  cursor:pointer;
}

.coin img {
  width:180px;
  height:180px;
  transition:0.15s;
}

.coin:active img {
  transform:scale(0.9);
}

/* + animation */
.plus {
  position:absolute;
  color:#f7931a;
  animation:fade 1s forwards;
}

@keyframes fade {
  0%{opacity:1;transform:translateY(0)}
  100%{opacity:0;transform:translateY(-60px)}
}

/* ===== SCREENS ===== */
.screen {
  display:none;
}

.screen.active {
  display:block;
}

/* ===== NAV ===== */
.nav {
  position:fixed;
  bottom:0;
  width:100%;
  display:flex;
}

.nav button {
  flex:1;
  padding:12px;
  border:none;
  background:rgba(20,20,20,0.7);
  color:white;
}

.nav button.active {
  background:#f7931a;
  color:black;
}

/* ===== CARDS ===== */
.card {
  background:rgba(20,20,20,0.6);
  padding:12px;
  margin:10px;
  border-radius:12px;
}

button {
  width:100%;
  padding:10px;
  margin-top:6px;
  border:none;
  border-radius:10px;
  background:#f7931a;
  color:black;
}

</style>
</head>

<body>

<div id="bg" class="bg-neon"></div>

<!-- HOME HEADER -->
<header id="mainHeader">
₿ <span id="coins">0</span>
</header>

<div class="energy" id="energyBar">
⚡ Energy: <span id="energy">0</span>
</div>

<!-- HOME -->
<div id="home" class="screen active">

  <div class="coin" onclick="tap(event)">
    <img src="https://cryptologos.cc/logos/bitcoin-btc-logo.png?v=029">
  </div>

</div>

<!-- SHOP -->
<div id="shop" class="screen">

  <div class="card">
    🛒 Shop<br><br>
    ₿ Balance: <span id="shopCoins">0</span>

    <button onclick="buy('p1')">+1 Power (150₿)</button>
    <button onclick="buy('p2')">+2 Power (400₿)</button>
    <button onclick="buy('energy')">+50 Energy (300₿)</button>
  </div>

</div>

<!-- TOP -->
<div id="top" class="screen">

  <div class="card"><b>🏆 Leaderboard</b></div>

  <div id="list"></div>

</div>

<!-- PROFILE -->
<div id="profile" class="screen">

  <div class="card">
    👤 Profile<br><br>
    ID: <span id="pid"></span><br>
    Coins: <span id="pcoins"></span><br>
    Energy: <span id="penergy"></span>
  </div>

</div>

<!-- NAV -->
<div class="nav">
  <button class="active" onclick="show('home',this)">Home</button>
  <button onclick="show('shop',this)">Shop</button>
  <button onclick="show('top',this);loadTop()">Top</button>
  <button onclick="show('profile',this)">Profile</button>
</div>

<script>

let id = "1";
let user;

/* LOAD */
async function load(){

  let r = await fetch("/user/"+id);
  user = await r.json();

  document.getElementById("coins").innerText = user.coins;
  document.getElementById("energy").innerText = user.energy;

  document.getElementById("shopCoins").innerText = user.coins;

  document.getElementById("pid").innerText = user.id;
  document.getElementById("pcoins").innerText = user.coins;
  document.getElementById("penergy").innerText = user.energy;
}

/* TAP */
async function tap(e){

  let r = await fetch("/tap", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({id})
  });

  let d = await r.json();

  load();

  let el = document.createElement("div");
  el.className="plus";
  el.innerText="+"+d.crit;
  el.style.left=e.clientX+"px";
  el.style.top=e.clientY+"px";

  document.body.appendChild(el);

  setTimeout(()=>el.remove(),1000);
}

/* BUY */
async function buy(item){

  await fetch("/buy", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({id,item})
  });

  load();
}

/* TOP */
async function loadTop(){

  let r = await fetch("/leaderboard");
  let d = await r.json();

  document.getElementById("list").innerHTML =
    d.map((x,i)=>`
      <div class="card">
        #${i+1} ${x.name} — ${x.coins} ₿
      </div>
    `).join("");
}

/* NAV */
function show(page,btn){

  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(page).classList.add("active");

  document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");

  const header = document.getElementById("mainHeader");
  const energy = document.getElementById("energyBar");

  if(page==="home"){
    header.style.display="block";
    energy.style.display="block";
  } else {
    header.style.display="none";
    energy.style.display="none";
  }
}

load();

</script>

</body>
</html>
